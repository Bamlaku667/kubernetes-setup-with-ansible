---
# tasks/main.yml - Setup prerequisites for Longhorn storage

- name: Ensure required packages are installed
  package:
    name:
      - iscsi-initiator-utils
      - nfs-utils
      - cryptsetup
      - device-mapper
    state: present
  when: ansible_os_family in ["RedHat", "Rocky", "AlmaLinux", "CentOS"]

# Multipath is disabled, so no enable/start here

- name: Stop and disable multipathd service (if installed)
  systemd:
    name: multipathd
    enabled: false
    state: stopped
  ignore_errors: true
  when: ansible_os_family in ["RedHat", "Rocky", "AlmaLinux", "CentOS"]

- name: Enable and start iSCSI service (RHEL-based)
  systemd:
    name: iscsid
    enabled: yes
    state: started
  when: ansible_os_family in ["RedHat", "Rocky", "AlmaLinux", "CentOS"]

- name: Load required kernel modules
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - nfs
    - iscsi_tcp
    - dm_crypt

- name: Ensure kernel modules load on boot
  lineinfile:
    path: /etc/modules-load.d/longhorn.conf
    create: yes
    line: "{{ item }}"
  loop:
    - nfs
    - iscsi_tcp
    - dm_crypt
    - dm_mod

- name: Verify modules are loaded
  shell: "lsmod | grep -E 'nfs|iscsi_tcp|dm_crypt'"
  register: modules_check
  changed_when: false

- debug:
    msg: "Kernel modules loaded: {{ modules_check.stdout_lines }}"

# --- New tasks for Longhorn data path ---

- name: Delete old Longhorn directory if exists
  file:
    path: /var/lib/longhorn
    state: absent
  ignore_errors: true

- name: Create Longhorn data directory on /data
  file:
    path: /data/longhorn
    state: directory
    owner: 1000   # Longhorn runs as UID 1000
    group: 1000
    mode: '0755'

- name: Confirm Longhorn data directory exists
  stat:
    path: /data/longhorn
  register: longhorn_dir

- debug:
    msg: "Longhorn data directory prepared at /data/longhorn: {{ longhorn_dir.stat.exists }}"
