# -------------------------------
# SYSTEMD SERVICE
# -------------------------------

- name: Create NiFi systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nifi.service
    mode: '0644'
    content: |
      [Unit]
      Description=Apache NiFi Dataflow
      After=network.target

      [Service]
      Type=forking
      User={{ nifi_user }}
      Group={{ nifi_group }}
      ExecStart={{ nifi_install_dir }}/nifi-{{ nifi_version }}/bin/nifi.sh start
      ExecStop={{ nifi_install_dir }}/nifi-{{ nifi_version }}/bin/nifi.sh stop
      Restart=on-abort
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start NiFi
  ansible.builtin.systemd:
    name: nifi
    enabled: yes
    state: started

