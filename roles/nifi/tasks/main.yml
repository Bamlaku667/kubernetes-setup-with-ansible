---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - java-21-openjdk
      - unzip
      - wget
      - openssl
    state: present

- name: Create NiFi user and group
  ansible.builtin.user:
    name: "{{ nifi_user }}"
    comment: "NiFi Service Account"
    home: "{{ nifi_install_dir }}"
    shell: /bin/bash
    system: yes

- name: Create NiFi directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nifi_user }}"
    group: "{{ nifi_group }}"
    mode: '0755'
  loop:
    - "{{ nifi_install_dir }}"
    - "{{ nifi_data_dir }}"
    - "{{ nifi_install_dir }}/certs"

# -------------------------------
# NiFi DOWNLOAD & EXTRACTION
# -------------------------------

- name: Download NiFi archive (ZIP format)
  ansible.builtin.get_url:
    url: "{{ nifi_download_url }}"
    dest: "/tmp/nifi-{{ nifi_version }}-bin.zip"
    mode: '0644'
  when: not lookup('ansible.builtin.fileglob', '/tmp/nifi-{{ nifi_version }}-bin.zip', errors='ignore')

- name: Backup existing NiFi installation (if exists)
  ansible.builtin.command:
    cmd: mv {{ nifi_install_dir }}/nifi-{{ nifi_version }} {{ nifi_install_dir }}/nifi-{{ nifi_version }}-backup-{{ ansible_date_time.date }}
    removes: "{{ nifi_install_dir }}/nifi-{{ nifi_version }}"
  ignore_errors: yes

- name: Extract NiFi ZIP archive
  ansible.builtin.unarchive:
    src: "/tmp/nifi-{{ nifi_version }}-bin.zip"
    dest: "{{ nifi_install_dir }}"
    remote_src: yes
    creates: "{{ nifi_install_dir }}/nifi-{{ nifi_version }}"

- name: Symlink NiFi current version
  ansible.builtin.file:
    src: "{{ nifi_install_dir }}/nifi-{{ nifi_version }}"
    dest: "{{ nifi_install_dir }}/current"
    state: link

# -------------------------------
# SSL CERTIFICATE GENERATION STAGE
# -------------------------------

- name: Generate OpenSSL config with SANs
  ansible.builtin.copy:
    dest: "{{ nifi_install_dir }}/certs/openssl.cnf"
    content: |
      [ req ]
      distinguished_name = req_distinguished_name
      req_extensions     = v3_req
      prompt = no

      [ req_distinguished_name ]
      C = ET
      ST = AddisAbaba
      L = AddisAbaba
      O = SuperApp
      OU = NiFiCluster
      CN = {{ ansible_hostname }}

      [ v3_req ]
      subjectAltName = @alt_names

      [ alt_names ]
      DNS.1 = {{ ansible_hostname }}
      DNS.2 = nifi01
      DNS.3 = nifi02
      DNS.4 = nifi03
      DNS.5 = getfeenifi.cbe.com.et
      DNS.6 = nifilb.cbe.com.et
      IP.1 = 10.1.80.111
      IP.2 = 10.1.80.112
      IP.3 = 10.1.80.113

- name: Generate private key if not exists
  ansible.builtin.command:
    cmd: openssl genrsa -out {{ nifi_install_dir }}/certs/{{ ansible_hostname }}.key 4096
    creates: "{{ nifi_install_dir }}/certs/{{ ansible_hostname }}.key"

- name: Generate certificate signing request (CSR)
  ansible.builtin.command:
    cmd: >
      openssl req -new -key {{ nifi_install_dir }}/certs/{{ ansible_hostname }}.key
      -out {{ nifi_install_dir }}/certs/{{ ansible_hostname }}.csr
      -config {{ nifi_install_dir }}/certs/openssl.cnf
    creates: "{{ nifi_install_dir }}/certs/{{ ansible_hostname }}.csr"

- name: Generate self-signed certificate (valid for 3 years)
  ansible.builtin.command:
    cmd: >
      openssl x509 -req -in {{ nifi_install_dir }}/certs/{{ ansible_hostname }}.csr
      -signkey {{ nifi_install_dir }}/certs/{{ ansible_hostname }}.key
      -out {{ nifi_install_dir }}/certs/{{ ansible_hostname }}.crt
      -days 1095 -extensions v3_req -extfile {{ nifi_install_dir }}/certs/openssl.cnf
    creates: "{{ nifi_install_dir }}/certs/{{ ansible_hostname }}.crt"

- name: Generate PKCS12 keystore (contains key + cert)
  ansible.builtin.command:
    cmd: >
      openssl pkcs12 -export
      -in {{ nifi_install_dir }}/certs/{{ ansible_hostname }}.crt
      -inkey {{ nifi_install_dir }}/certs/{{ ansible_hostname }}.key
      -out {{ nifi_install_dir }}/certs/{{ ansible_hostname }}.p12
      -name {{ ansible_hostname }}
      -passout pass:changeit
    creates: "{{ nifi_install_dir }}/certs/{{ ansible_hostname }}.p12"

- name: Generate truststore (import same cert for simplicity)
  ansible.builtin.command:
    cmd: >
      keytool -importcert
      -noprompt
      -alias {{ ansible_hostname }}
      -file {{ nifi_install_dir }}/certs/{{ ansible_hostname }}.crt
      -keystore {{ nifi_install_dir }}/certs/truststore.p12
      -storetype PKCS12
      -storepass changeit
    creates: "{{ nifi_install_dir }}/certs/truststore.p12"

- name: Set certificate ownership
  ansible.builtin.file:
    path: "{{ nifi_install_dir }}/certs"
    owner: "{{ nifi_user }}"
    group: "{{ nifi_group }}"
    recurse: yes
    mode: '0600'

# -------------------------------
# SERVICE SETUP
# -------------------------------

- name: Set permissions
  ansible.builtin.file:
    path: "{{ nifi_install_dir }}"
    recurse: yes
    owner: "{{ nifi_user }}"
    group: "{{ nifi_group }}"

- name: Create systemd service file
  ansible.builtin.copy:
    dest: /etc/systemd/system/nifi.service
    content: |
      [Unit]
      Description=Apache NiFi
      After=network.target

      [Service]
      Type=forking
      User={{ nifi_user }}
      ExecStart={{ nifi_install_dir }}/current/bin/nifi.sh start
      ExecStop={{ nifi_install_dir }}/current/bin/nifi.sh stop
      Environment=JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start NiFi
  ansible.builtin.systemd:
    name: nifi
    enabled: yes
    state: started
