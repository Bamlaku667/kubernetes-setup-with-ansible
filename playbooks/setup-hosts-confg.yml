- name: Safely append host mappings to /etc/hosts
  hosts: all
  become: yes
  gather_facts: no

  vars:
    hosts_mapping:
      master01: 10.1.80.100
      master02: 10.1.80.101
      master03: 10.1.80.102
      worker01: 10.1.80.103
      worker02: 10.1.80.104
      worker03: 10.1.80.105
      worker04: 10.1.80.106
      worker05: 10.1.80.107
      lb01: 10.1.80.108
      lb02: 10.1.80.109
      lb03: 10.1.80.110
      nifi01: 10.1.80.111
      nifi02: 10.1.80.112
      nifi03: 10.1.80.113
      automation: 10.1.80.114
      getfeelb: 10.1.80.115
      getfeeharbor: 10.1.80.116

  tasks:
    - name: Ensure each mapping exists in /etc/hosts (append if missing)
      lineinfile:
        path: /etc/hosts
        line: "{{ item.value }} {{ item.key }}"
        state: present
        insertafter: EOF
      loop: "{{ hosts_mapping | dict2items }}"
