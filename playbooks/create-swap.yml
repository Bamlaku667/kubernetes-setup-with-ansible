- name: Ensure swap file exists and configured
  hosts:
  - lb
  - automation
  - nifi
  become: true
  vars:
    swap_file_path: /swapfile
    swap_file_size: 4G
    swappiness_value: 20

  tasks:

    - name: Check if swap file already exists
      stat:
        path: "{{ swap_file_path }}"
      register: swap_file_stat

    - name: Create swap file if it does not exist
      command: "fallocate -l {{ swap_file_size }} {{ swap_file_path }}"
      when: not swap_file_stat.stat.exists

    - name: Set permissions on swap file
      file:
        path: "{{ swap_file_path }}"
        owner: root
        group: root
        mode: '0600'

    - name: Make swap file
      command: "mkswap {{ swap_file_path }}"
      when: not swap_file_stat.stat.exists

    - name: Enable swap file
      command: "swapon {{ swap_file_path }}"
      register: enable_swap
      failed_when: enable_swap.rc != 0 and 'File exists' not in enable_swap.stderr

    - name: Ensure swap file is added to fstab
      mount:
        name: none
        src: "{{ swap_file_path }}"
        fstype: swap
        opts: sw
        state: present

    - name: Set swappiness value
      sysctl:
        name: vm.swappiness
        value: "{{ swappiness_value }}"
        state: present
        reload: yes
